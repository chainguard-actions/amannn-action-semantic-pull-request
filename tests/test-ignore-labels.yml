name: Test ignoreLabels input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create mock GitHub event with skip-validation label
        run: |
          mkdir -p /tmp/github-event
          cat > /tmp/github-event/event.json <<'EOF'
          {
            "pull_request": {
              "title": "This is not a conventional commit title",
              "number": 1,
              "labels": [
                {
                  "name": "skip-semantic-pr"
                }
              ]
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-event/event.json" >> $GITHUB_ENV
      - id: action
        uses: .
        with:
          ignoreLabels: |
            skip-semantic-pr
            no-validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Assert action completed
        run: |
          echo "Action completed successfully with ignoreLabels input - validation skipped due to label"
          echo "PASS"
