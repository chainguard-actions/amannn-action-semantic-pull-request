name: Test subject pattern and disallow scopes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          disallowScopes: |
            release
            hotfix
          subjectPattern: '^(?![A-Z]).+$'
          subjectPatternError: 'The subject "{subject}" found in the pull request title "{title}" must not start with an uppercase character.'
      - name: Assert action ran (inputs accepted)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with disallowScopes/subjectPattern/subjectPatternError inputs"
